name: MZGram Desktop release

# A tag vX.Y.Z (stable) or vX.Y.Z-beta.N (prerelease) on the mzgram branch
# builds Release binaries and publishes a GitHub release with:
#   MZGram-Desktop-X.Y.Z-windows-x64.zip, MZGram-Desktop-X.Y.Z-windows-arm64.zip,
#   MZGram-Desktop-X.Y.Z-linux-x64.tar.xz, MZGram-Desktop-X.Y.Z-source.tar.xz
#   (the complete source with every submodule, for the GPL), SHA256SUMS,
# and the [mzgram] commits since the previous release as the notes.
# The release is created as a draft and published only when every file is in
# it: the channel bot reads published releases and needs the whole set.
#
# The push workflows build Debug only: the Windows dependency tree with Debug
# and Release measures ~44 GB. Here the Windows jobs put the build on the
# drive with the most free space and keep their own cache of the Release
# dependencies. The cache is saved even when a job stops half way, so a cold
# dependency build that does not fit in one job's 6 hours goes on in the
# next run (prepare.py skips the stages it already built).
#
# Run by hand (workflow_dispatch) it builds everything as artifacts without a
# release: that is also how the dependency cache is warmed before a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to build without publishing, e.g. v1.0.0'
        required: true

permissions:
  contents: write

concurrency:
  group: mzgram-desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      upstream: ${{ steps.version.outputs.upstream }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version.
        id: version
        shell: bash
        run: |
          python3 .github/scripts/test_mzgram_version.py
          if [ "$PUBLISH" = true ]; then
            git fetch -q origin mzgram
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/mzgram; then
              echo "::error::$TAG does not point to a commit of the mzgram branch"
              exit 1
            fi
          fi
          UPSTREAM=$(awk '$1 == "AppVersionStr" { print $2 }' Telegram/build/version)
          git tag -l 'v*' | python3 .github/scripts/mzgram_version.py release "$TAG" --upstream "$UPSTREAM" --floor 0 | tee -a "$GITHUB_OUTPUT"
          echo "upstream=$UPSTREAM" >> "$GITHUB_OUTPUT"
          echo "previous=$(git tag -l 'v*' | python3 .github/scripts/mzgram_version.py previous "$TAG")" | tee -a "$GITHUB_OUTPUT"

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include:
          # The 14.44 toolset is what keeps Windows 7 support alive on x64.
          - arch: x64
            toolset: '14.44'
            configure_arch: 'x64'
            libs_suffix: '\win64'
          - arch: arm64
            toolset: ''
            configure_arch: 'arm'
            libs_suffix: ''

    defaults:
      run:
        shell: cmd

    steps:
      # The drive with the most free space holds the build; on x64 runners
      # that is usually not C:.
      - name: Prepare directories.
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}
          $drive = Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free -gt 0 } | Sort-Object Free -Descending | Select-Object -First 1
          $root = if ($drive.Name -eq 'C') { Join-Path $env:USERPROFILE 'TBuild' } else { "$($drive.Name):\TBuild" }
          New-Item -ItemType Directory -Force (Join-Path $root 'Libraries') | Out-Null
          New-Item -ItemType SymbolicLink -Path (Join-Path $env:GITHUB_WORKSPACE 'TBuild') -Target $root | Out-Null
          "TBUILD=$env:GITHUB_WORKSPACE\TBuild" >> $env:GITHUB_ENV
          "LibrariesPath=$env:GITHUB_WORKSPACE\TBuild\Libraries${{ matrix.libs_suffix }}" >> $env:GITHUB_ENV
          Write-Output "Build root: $root"

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          # Upstream strips /Zi so the library cache stays within size limits.
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/Telegram/build/prepare/prepare.py | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          # prepare.py cherry-picks patches onto some dependencies.
          git config --global user.email "ci@mzgram.local"
          git config --global user.name "MZGram CI"

      - name: Install VS Build Tools.
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
          Invoke-WebRequest -Uri https://aka.ms/vs/18/stable/vs_buildtools.exe -OutFile $exe
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList `
            '--quiet','--wait','--norestart','--nocache', `
            '--add','Microsoft.VisualStudio.Workload.VCTools', `
            '--add','Microsoft.VisualStudio.Component.VC.Tools.ARM64', `
            '--add','Microsoft.VisualStudio.Component.VC.ATL.ARM64'
          Remove-Item $exe -Force -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { exit $p.ExitCode }

      - name: Native Tools Command Prompt.
        uses: Eden-CI/msvc-dev-cmd@master
        with:
          arch: ${{ matrix.arch }}
          sdk: ${{ env.SDK }}
          toolset: ${{ matrix.toolset }}

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        uses: actions/cache@v6
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-${{ runner.arch }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-${{ runner.arch }}-third-party-

      - name: Restore the Release libraries.
        id: libs
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            ${{ env.LibrariesPath }}\cache_keys\*
          key: ${{ runner.OS }}-${{ matrix.arch }}-libs-qt6-full-${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.OS }}-${{ matrix.arch }}-libs-qt6-full-${{ env.CACHE_KEY }}-
            ${{ runner.OS }}-${{ matrix.arch }}-libs-qt6-full-

      # The marker says the cached tree is whole; a cache saved from a run
      # that stopped half way has none, and prepare.py finishes it.
      - name: Check the Release libraries.
        id: libs-state
        shell: bash
        run: |
          if [ -f "$LibrariesPath/cache_keys/mzgram-release-complete" ]; then
            echo "complete=true" >> $GITHUB_OUTPUT
          else
            echo "complete=false" >> $GITHUB_OUTPUT
          fi

      - name: Make room on drive C.
        shell: bash
        run: |
          df -h /c
          for dir in /c/Android /c/hostedtoolcache/windows/CodeQL /c/hostedtoolcache/windows/go \
              /c/hostedtoolcache/windows/Ruby /c/hostedtoolcache/windows/PyPy /c/SeleniumWebDrivers \
              "/c/Program Files/Microsoft SQL Server" "/c/Program Files (x86)/Microsoft SQL Server" \
              /c/ghcup /c/Miniconda /c/vcpkg /c/Users/runneradmin/.rustup /c/Users/runneradmin/.cargo \
              /c/hostedtoolcache/windows/Java_* /c/hostedtoolcache/windows/node \
              "/c/Program Files/MongoDB" "/c/Program Files/MySQL" \
              "/c/Program Files/Google/Chrome" "/c/Program Files/Mozilla Firefox"; do
            if [ -d "$dir" ]; then
              echo "removing $dir"
              rm -rf "$dir" || true
            fi
          done
          df -h /c

      # dump_syms, breakpad's symbol tool, is built only for Release and needs
      # ATL, which neither runner has for the toolset in use. It only serves
      # crash report symbols, and MZGram builds without crash reports; the
      # breakpad libraries themselves are still built.
      - name: Leave out dump_syms.
        shell: bash
        run: |
          python - "$TBUILD/$REPO_NAME/Telegram/build/prepare/prepare.py" <<'EOF'
          import sys
          path = sys.argv[1]
          lines = open(path, encoding='utf-8').read().split('\n')
          kept = [line for line in lines if not ('dump_syms' in line and ('windows' in line or 'gyp ' in line or 'msbuild' in line))]
          assert len(lines) - len(kept) == 3, len(lines) - len(kept)
          open(path, 'w', encoding='utf-8', newline='\n').write('\n'.join(kept))
          EOF

      # Debug and Release of every dependency (no skip-release).
      - name: Libraries.
        id: prepare
        if: steps.libs-state.outputs.complete != 'true'
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent qt6 && echo complete> %LibrariesPath%\cache_keys\mzgram-release-complete

      - name: Free up some disk space.
        if: always() && steps.libs.outcome == 'success' && steps.prepare.outcome != 'skipped'
        shell: bash
        run: |
          find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete
          du -sh $LibrariesPath || true

      # Saved even when the libraries step failed or ran out of time, so the
      # next run goes on from the stages already built.
      - name: Save the Release libraries.
        if: always() && steps.libs.outcome == 'success' && steps.prepare.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            ${{ env.LibrariesPath }}\cache_keys\*
          key: ${{ steps.libs.outputs.cache-primary-key }}

      - name: Resolve API credentials.
        shell: bash
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            echo "MZGRAM_API=-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH" >> $GITHUB_ENV
          else
            echo "::error::No API credentials: a release could not sign in."
            exit 1
          fi

      - name: Build.
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          ${{ matrix.configure_arch }} ^
          qt6 ^
          %MZGRAM_API% ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON ^
          -D DESKTOP_APP_TEST_APPS=ON

          cmake --build ..\out --config Release --parallel

      - name: Run MZGram unit tests.
        run: |
          %TBUILD%\%REPO_NAME%\out\Release\mzgram_tests.exe

      - name: Package.
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          OUT=$TBUILD/$REPO_NAME/out/Release
          ls -la "$OUT"
          mkdir -p "$RUNNER_TEMP/pkg/MZGram" dist
          cp "$OUT/MZGram.exe" "$RUNNER_TEMP/pkg/MZGram/"
          # d3dcompiler for the OpenGL renderer on systems without it, as upstream ships it
          [ ! -d "$OUT/modules" ] || cp -r "$OUT/modules" "$RUNNER_TEMP/pkg/MZGram/"
          ZIP="MZGram-Desktop-$VERSION-windows-${{ matrix.arch }}.zip"
          pwsh -NoProfile -Command "Compress-Archive -Path '$(cygpath -w "$RUNNER_TEMP/pkg/MZGram")' -DestinationPath '$(cygpath -w "$GITHUB_WORKSPACE/dist/$ZIP")' -CompressionLevel Optimal"
          ls -la dist "$RUNNER_TEMP/pkg/MZGram"

      - name: Upload.
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: dist/

  linux:
    name: Linux x64
    needs: version
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: tdesktop:centos_env

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: First set up.
        run: |
          sudo apt update
          curl -sSL https://install.python-poetry.org | python3 -
          cd Telegram/build/docker/centos_env
          poetry install
          DOCKERFILE=$(DEBUG= LTO= poetry run gen_dockerfile)
          echo "$DOCKERFILE" > Dockerfile
          rm -rf __pycache__

      - name: Free up some disk space.
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true

      - name: Set up Docker Buildx.
        id: setup-buildx
        uses: docker/setup-buildx-action@v4

      # The same library image as the push workflow: it holds Release libraries only.
      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/.buildx-cache
            ${{ runner.temp }}/.mount-cache
          key: ${{ runner.OS }}-libs-${{ hashFiles('Telegram/build/docker/centos_env/**') }}
          restore-keys: ${{ runner.OS }}-libs-

      - name: Restore Docker cache mounts.
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: ${{ runner.temp }}/.mount-cache
          dockerfile: Telegram/build/docker/centos_env/Dockerfile
          skip-extraction: ${{ steps.cache-libs.outputs.cache-hit }}

      - name: Libraries.
        uses: docker/build-push-action@v7
        with:
          context: Telegram/build/docker/centos_env
          load: true
          tags: ${{ env.IMAGE_TAG }}
          cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
          cache-to: type=local,dest=${{ runner.temp }}/.buildx-cache-new,mode=max

      - name: Move cache.
        run: |
          rm -rf ${{ runner.temp }}/.buildx-cache
          mv ${{ runner.temp }}/.buildx-cache{-new,}

      - name: Resolve API credentials.
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -n "$API_ID" ] && [ -n "$API_HASH" ]; then
            echo "MZGRAM_API=-D TDESKTOP_API_ID=$API_ID -D TDESKTOP_API_HASH=$API_HASH" >> $GITHUB_ENV
          else
            echo "::error::No API credentials: a release could not sign in."
            exit 1
          fi

      # MZGRAM_API is left unquoted on purpose: it splits into -D arguments.
      # No compiler cache: a cached Release tree would not fit next to the
      # push workflows' caches in the repository's 10 GB.
      - name: Build.
        run: |
          docker run --rm \
          -u $(id -u) \
          -v $PWD:/usr/src/tdesktop \
          -e CONFIG=Release \
          $IMAGE_TAG \
          /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
          -D CMAKE_CONFIGURATION_TYPES=Release \
          $MZGRAM_API \
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON \
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      # tar keeps the executable bit, which an artifact zip drops.
      - name: Package.
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          ls -la out/Release
          test -f out/Release/MZGram
          mkdir -p "$RUNNER_TEMP/pkg/MZGram" dist
          cp out/Release/MZGram "$RUNNER_TEMP/pkg/MZGram/"
          tar -cJf "dist/MZGram-Desktop-$VERSION-linux-x64.tar.xz" -C "$RUNNER_TEMP/pkg" MZGram
          tar -tvJf "dist/MZGram-Desktop-$VERSION-linux-x64.tar.xz"

      - name: Upload.
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: dist/

  publish:
    name: Release files and publish
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download the builds.
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      # The complete corresponding source for the GPL: this repository at the
      # tag with every submodule, as tracked by git.
      - name: Source archive.
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          NAME="MZGram-Desktop-$VERSION-source"
          git ls-files --recurse-submodules -z > "$RUNNER_TEMP/files"
          tar --null -T "$RUNNER_TEMP/files" --transform "s,^,$NAME/," -cJf "dist/$NAME.tar.xz"
          ls -la dist

      - name: Release files and notes.
        env:
          VERSION: ${{ needs.version.outputs.version }}
          UPSTREAM: ${{ needs.version.outputs.upstream }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
        run: |
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          RANGE=${PREVIOUS:+$PREVIOUS..}$GITHUB_SHA
          CHANGES=$(git log --no-merges --format=%s "$RANGE" | sed -n 's/^\[mzgram\] /- /p')
          {
            echo "MZGram Desktop $VERSION, based on Telegram Desktop $UPSTREAM."
            echo
            echo "## Changes"
            echo
            if [ -n "$CHANGES" ]; then echo "$CHANGES"; else echo "- No MZGram changes${PREVIOUS:+ since $PREVIOUS}, build only."; fi
            echo
            echo "## Install"
            echo
            echo "- Windows: unpack \`MZGram-Desktop-$VERSION-windows-x64.zip\` (or \`-arm64\` on ARM) and run \`MZGram.exe\`."
            echo "- Linux: unpack \`MZGram-Desktop-$VERSION-linux-x64.tar.xz\` and run \`MZGram\` (glibc 2.28 or newer)."
            echo
            echo "MZGram keeps its data in its own folder, apart from Telegram Desktop. Updates are not automatic: download the next release and replace the files."
            echo
            echo "\`MZGram-Desktop-$VERSION-source.tar.xz\` is the complete source of this release. \`SHA256SUMS\` lists the SHA-256 of every file."
          } > notes.md
          cat notes.md

      - name: Upload artifact.
        uses: actions/upload-artifact@v7
        with:
          name: MZGram-Desktop-${{ needs.version.outputs.version }}
          path: |
            dist/
            notes.md

      - name: Publish the release.
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          FLAGS=()
          [ "$PRERELEASE" != true ] || FLAGS+=(--prerelease)
          gh release create "$TAG" --draft --verify-tag --title "MZGram Desktop $VERSION" --notes-file notes.md "${FLAGS[@]}" dist/*
          # Every file must be in the release before it is published
          EXPECTED=$(ls dist | sort)
          UPLOADED=$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
          if [ "$EXPECTED" != "$UPLOADED" ]; then
            echo "::error::Release files differ from dist/: $UPLOADED"
            exit 1
          fi
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json url,isPrerelease,assets --jq '{url, isPrerelease, assets: [.assets[].name]}'
